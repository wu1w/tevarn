[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "takton"
version = "0.4.6-alpha"
description = "Takton - 个人专属 AI Agent 终端（前后端一体）"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "developer", email = "developer@takton.dev" }]
dependencies = [
  "fastapi==0.139.0",
  "uvicorn[standard]==0.50.2",
  "pydantic==2.13.4",
  "pydantic-settings>=2.2.1",
  "email-validator>=2.2.0",
  "sqlalchemy[asyncio]==2.0.36",
  "aiosqlite==0.21.0",
  "cryptography>=42.0.0",
  # core/security.py 直接 import jwt —— 必须显式声明，不能靠传递依赖
  "PyJWT>=2.8,<3",
  "passlib[bcrypt]==1.7.4",
  # 上界是硬约束：bcrypt>=4.1 移除了 passlib 1.7.4 依赖的 __about__，
  # 组合坏掉时任何密码都会报「longer than 72 bytes」，登录全挂。
  "bcrypt>=4.0,<5",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "aiohttp==3.14.1",
  "websockets==15.0.1",
  "python-dotenv==1.0.1",
  "pyyaml==6.0.2",
  "jinja2==3.1.5",
  "qdrant-client==1.12.1",
  "mcp>=1.12.0",
]

[project.optional-dependencies]
dev = [
  "asyncpg==0.30.0",
  "pytest==8.3.5",
  "pytest-asyncio==0.24.0",
  "asgi-lifespan==2.1.0",
]
postgres = ["asyncpg==0.30.0"]

[project.scripts]
takton = "backend.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["static/**/*", "static/**/.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "-ra -q"
