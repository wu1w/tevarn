[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tevarn"
version = "0.4.3"
description = "Tevarn - 个人专属 AI Agent 终端（前后端一体）"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "developer", email = "developer@tevarn.dev" }]
dependencies = [
  "fastapi==0.139.0",
  "uvicorn[standard]==0.50.2",
  "pydantic==2.13.4",
  "pydantic-settings>=2.2.1",
  "email-validator>=2.2.0",
  "sqlalchemy[asyncio]==2.0.51",
  "aiosqlite==0.21.0",
  "cryptography>=42.0.0",
  # core/security.py 直接 import jwt —— 必须显式声明，不能靠传递依赖
  "PyJWT>=2.8,<3",
  "passlib[bcrypt]==1.7.4",
  # 上界是硬约束：bcrypt>=4.1 移除了 passlib 1.7.4 依赖的 __about__，
  # 组合坏掉时任何密码都会报「longer than 72 bytes」，登录全挂。
  "bcrypt>=4.0,<5",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "aiohttp==3.14.1",
  "websockets==15.0.1",
  "python-dotenv==1.0.1",
  "pyyaml==6.0.2",
  "jinja2==3.1.5",
  "qdrant-client==1.12.1",
  "mcp>=1.12.0",
]

[project.optional-dependencies]
dev = [
  "asyncpg==0.30.0",
  "pytest==8.3.5",
  "pytest-asyncio==0.24.0",
  "asgi-lifespan==2.1.0",
]
postgres = ["asyncpg==0.30.0"]

[project.scripts]
tevarn = "backend.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["static/**/*", "static/**/.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
# function 级 loop：避免 session loop + LifespanManager 在 Windows/CI 上互锁挂死。
# aiosqlite teardown 噪音用 filterwarnings 压住（不断言失败）。
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
addopts = "-ra -q"
# CI 不得因单个测试挂死（等网络/子进程）而无限阻塞；
# Windows 上只能用 thread 方法（signal 方法仅 POSIX）。
timeout = 120
timeout_method = "thread"
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore::DeprecationWarning:fastapi.*",
]
markers = [
    "desktop: manual desktop integration (needs display; TEVARN_RUN_DESKTOP_TESTS=1)",
]

# ── Ruff：CI 门禁用的 linter ────────────────────────────────────────
# 规则集聚焦“拓真 bug + 导入卫生”，不引入纯风格噪音（E/W 全家），
# 也不做大规模 pyupgrade 改写（UP）——那会制造巨大 diff 且非 bug。
[tool.ruff]
target-version = "py310"
extend-exclude = [
    ".venv",
    "vendor",
    "frontend",
    "node_modules",
    "backend/static",
    "backend/migrations/versions",
    "tevarn-code",
    "tevarn-agent",
    "tests",  # 已归档：权威测试树为 backend/tests
]

[tool.ruff.lint]
select = ["F", "I", "B", "C4"]
ignore = [
    "B008",  # FastAPI Depends()/Header() 写在默认值里是惯用法，非缺陷
    "F403",  # main.py 的 from ... import *（插件式加载，故意）
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy Mapped["User"] 跨文件前向引用：ruff 看不到注册表，属误报
"backend/models/**" = ["F821"]
# __init__.py 重导出的未使用导入是故意的（对外暴露 API）
"**/__init__.py" = ["F401"]
# 测试里允许 assert-raises-Exception / 未用变量等便利写法
"backend/tests/**" = ["B017", "B011", "F841"]

# ── mypy：“类型化核心”门禁（逐步扩面）──────────────────────────────
# 全量 mypy 当前有 402 处历史欠账，无法一步 gate。策略：只对下方
# 已验证零错误的安全/并发核心模块开严格检查，日后逐步往 files 里添加。
# follow_imports=silent：只报这些文件自身的错误，不被上游未类型化模块连累。
[tool.mypy]
python_version = "3.10"
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = false
files = [
    "backend/core/command_policy.py",
    "backend/core/safe_subprocess.py",
    "backend/core/security.py",
    "backend/agent/dangerous_paths.py",
    "backend/agent/permissions_rules.py",
    "backend/agent/checkpoint.py",
    "backend/agent/turn_retry.py",
    "backend/repositories/session_repo.py",
    "backend/kernel/capability.py",
    "backend/kernel/signing.py",
]
