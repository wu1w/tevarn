# Alembic config - schema migrations (introduced in 0.4.6-alpha)
# NOTE: keep this file ASCII-only; alembic reads it with the locale codec on Windows.
# Usage (from repo root):
#   alembic -c backend/alembic.ini revision --autogenerate -m "msg"
#   alembic -c backend/alembic.ini upgrade head
# Existing DB first adoption: alembic -c backend/alembic.ini stamp 0001_baseline

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
# url left empty: env.py resolves it from backend.core.config.settings.db_url
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
