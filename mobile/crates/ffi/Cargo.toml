[package]
name = "takton-mobile-ffi"
version.workspace = true
edition.workspace = true
description = "C ABI / Flutter FFI surface over the Rust mobile engine"

[lib]
name = "takton_mobile_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
takton-mobile-core = { path = "../core" }
takton-mobile-host = { path = "../host" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
once_cell = "1"
