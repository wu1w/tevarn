<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http: https:; connect-src 'self' ws: wss: http: https:; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tevarn 手机端 · Pixel Console Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pixel-console.css">
<style>
/* skeleton — same tokens, shown until WASM mounts (anti-flash) */
#dx-boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#e8ebf0;background-image:radial-gradient(rgba(29,35,48,.07) 1px,transparent 1px);background-size:24px 24px;z-index:9999}
#dx-boot .phone{width:390px;height:min(844px,calc(100vh - 90px));min-height:640px;background:var(--bg,#f4f6f8);
  border-radius:36px;border:1px solid rgba(29,35,48,.16);box-shadow:0 24px 64px rgba(29,35,48,.14);
  display:flex;align-items:center;justify-content:center;font-family:Silkscreen,monospace;font-size:11px;color:#6d5df6}
@media(max-width:920px){#dx-boot .phone{width:100%;height:100vh;min-height:100vh;border:none;border-radius:0}}
/* dioxus root fills viewport — width critical (body align used to shrink-wrap) */
html,body{width:100%;height:100%;margin:0}
#main{width:100%;max-width:100vw;min-height:100vh;height:100%;display:flex;flex-direction:column}
</style>
</head>
<body>
<div id="dx-boot"><div class="phone">TEVARN · LOADING</div></div>
<div id="main"></div>
<script type="module">
  import init from './tevarn_mobile_web.js';
  try {
    await init();
    // give dioxus a tick to paint
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const boot = document.getElementById('dx-boot');
    if (boot) boot.remove();
  } catch (e) {
    console.error(e);
    const b = document.getElementById('dx-boot');
    if (b) b.innerHTML = '<div class="phone">LOAD ERROR · see console</div>';
  }
</script>
</body>
</html>
