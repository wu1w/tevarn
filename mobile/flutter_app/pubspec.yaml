name: takton_mobile
description: Takton Pixel Console — Flutter shell, Rust engine
publish_to: "none"
version: 0.4.8+21

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  web_socket_channel: ^3.0.1
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.4+1
  intl: ^0.19.0
  collection: ^1.18.0
  ffi: ^2.1.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  mobile_scanner: ^6.0.2
  speech_to_text: ^7.4.0
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/takton_logo.png
