[workspace]
resolver = "2"
members = [
    "crates/takton-kernel",
    "crates/takton-runtime",
    "crates/takton-kernel-host",
]
default-members = [
    "crates/takton-kernel",
    "crates/takton-runtime",
    "crates/takton-kernel-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Takton"]
repository = "https://github.com/wu1w/takton"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
indexmap = { version = "2", features = ["serde"] }
anyhow = "1"
once_cell = "1"
# WASM skill runtime (real Cranelift engine; fuel + memory limits)
wasmtime = { version = "28", default-features = true, features = ["cranelift", "wat", "parallel-compilation"] }
