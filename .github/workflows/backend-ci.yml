name: backend-ci

on:
  push:
    branches: [main, feature/agent-kernel]
    paths:
      - "backend/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r backend/requirements-dev.txt

      - name: Ruff lint (gate)
        run: python -m ruff check backend

      - name: Mypy type-check (gate, typed core only)
        run: python -m mypy

      - name: Version sync check (backend/VERSION authority)
        run: python scripts/sync_version.py --check

      - name: Pytest collection sanity (fail fast on import/collect errors)
        run: python -m pytest backend/tests --co -q

      - name: Security regression suite (Phase 1.1)
        env:
          TAKTON_DB_URL: "sqlite+aiosqlite:///./ci-test.db"
          TAKTON_TEST_MODE: "1"
          TAKTON_AGENT_DISPATCHER_ENABLED: "false"
          TAKTON_AGENT_KERNEL_PERSISTENCE: "false"
          TAKTON_JWT_SECRET: "ci-jwt-secret-not-for-production-use-32b"
          TAKTON_API_KEY: "ci-api-key-not-for-production-use-32bxxxx"
        run: python -m pytest backend/tests/security -q

      # 唯一权威测试树：backend/tests（根 tests/ 已归档，见 tests/README.md）
      - name: Run tests (backend/tests)
        env:
          TAKTON_DB_URL: "sqlite+aiosqlite:///./ci-test.db"
          TAKTON_TEST_MODE: "1"
          TAKTON_AGENT_DISPATCHER_ENABLED: "false"
          TAKTON_AGENT_KERNEL_PERSISTENCE: "false"
          TAKTON_JWT_SECRET: "ci-jwt-secret-not-for-production-use-32b"
          TAKTON_API_KEY: "ci-api-key-not-for-production-use-32bxxxx"
        run: python -m pytest backend/tests -q --tb=short --junitxml=pytest-report.xml

      - name: Upload pytest report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore

      - name: Alembic sanity (env.py loads, baseline resolvable)
        run: |
          pip install alembic
          alembic -c backend/alembic.ini heads

      # T10：无 host 时软通过；有 artifact / 本地周报时检查阈值
      - name: Eval weekly gate (soft without host)
        env:
          TAKTON_TEST_MODE: "1"
        run: python scripts/ci_eval_gate.py

      # H-12：Phase H 硬化单测（不依赖 host 的部分；完整 ABI 见 kernel-ci.yml）
      - name: Phase H hardening unit tests
        env:
          TAKTON_DB_URL: "sqlite+aiosqlite:///./ci-test.db"
          TAKTON_TEST_MODE: "1"
          TAKTON_AGENT_DISPATCHER_ENABLED: "false"
          TAKTON_AGENT_KERNEL_PERSISTENCE: "false"
          TAKTON_JWT_SECRET: "ci-jwt-secret-not-for-production-use-32b"
          TAKTON_API_KEY: "ci-api-key-not-for-production-use-32bxxxx"
          TAKTON_KERNEL_BACKEND: "python"
        run: python -m pytest backend/tests/kernel/test_phase_h_hardening.py -q --tb=short
