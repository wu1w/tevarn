name: backend-ci

on:
  push:
    branches: [main, feature/agent-kernel]
    paths:
      - "backend/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r backend/requirements-dev.txt

      - name: Ruff lint (gate)
        run: python -m ruff check backend tests

      - name: Mypy type-check (gate, typed core only)
        run: python -m mypy

      - name: Version sync check (backend/VERSION authority)
        run: python scripts/sync_version.py --check

      - name: Pytest collection sanity (fail fast on import/collect errors)
        run: python -m pytest backend/tests tests --co -q

      - name: Security regression suite (Phase 1.1)
        env:
          TAKTON_DB_URL: "sqlite+aiosqlite:///./ci-test.db"
          TAKTON_TEST_MODE: "1"
          TAKTON_AGENT_DISPATCHER_ENABLED: "false"
          TAKTON_AGENT_KERNEL_PERSISTENCE: "false"
          TAKTON_JWT_SECRET: "ci-jwt-secret-not-for-production-use-32b"
          TAKTON_API_KEY: "ci-api-key-not-for-production-use-32bxxxx"
        run: python -m pytest backend/tests/security -q

      - name: Run tests
        env:
          TAKTON_DB_URL: "sqlite+aiosqlite:///./ci-test.db"
          TAKTON_TEST_MODE: "1"
          TAKTON_AGENT_DISPATCHER_ENABLED: "false"
          TAKTON_AGENT_KERNEL_PERSISTENCE: "false"
          TAKTON_JWT_SECRET: "ci-jwt-secret-not-for-production-use-32b"
          TAKTON_API_KEY: "ci-api-key-not-for-production-use-32bxxxx"
        run: python -m pytest backend/tests tests -q

      - name: Alembic sanity (env.py loads, baseline resolvable)
        run: |
          pip install alembic
          alembic -c backend/alembic.ini heads
